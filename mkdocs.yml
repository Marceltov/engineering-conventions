site_name: engineering-conventions
site_description: How Marcel Bruckner builds software. Architecture, code, repository setup and stacks, with the reason for each rule and what it rules out.
site_url: https://engineering-conventions.marceltov.de/
repo_url: https://github.com/Marceltov/engineering-conventions
repo_name: Marceltov/engineering-conventions
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>

hooks:
  - docs_hooks/roadmap.py

nav:
  - Home: index.md
  - What engineering-conventions stands for: values.md
  - Where engineering-conventions is going: roadmap.md
  - Architecture:
      - MCP first, one domain layer: architecture/mcp-first.md
      - One gate for every read: architecture/one-gate-for-every-read.md
      - One data layer, the tenant in one place: architecture/data-layer.md
      - Sign-in: architecture/sign-in.md
      - Selling a hosted instance: architecture/payments.md
  - Code:
      - Language and internationalization: code/language.md
      - Accessibility: code/accessibility.md
      - Icons: code/icons.md
      - HTTPS clients trust the OS certificate store: code/https-clients.md
      - Formatting and linting: code/formatting.md
      - Shared code lives once: code/shared-code-lives-once.md
      - Tests keep their data in temporary directories: code/tests-temp-dirs.md
  - Repository setup:
      - CLAUDE.md: repo-setup/claude-md.md
      - Values and roadmap pages: repo-setup/values-and-roadmap.md
      - Where a repository lives: repo-setup/where-a-repo-lives.md
      - Architecture decisions: repo-setup/adrs.md
      - Issues and ideas: repo-setup/issues-and-ideas.md
      - Documentation site: repo-setup/docs-site.md
      - Docs live with the code: repo-setup/docs-live-with-the-code.md
      - Diagrams: repo-setup/diagrams.md
      - Charts: repo-setup/charts.md
      - Dependabot with auto-merge: repo-setup/dependabot.md
      - Releases: repo-setup/releases.md
      - Security setup: repo-setup/security.md
      - Contributor licence agreement: repo-setup/cla.md
      - Deploying with Docker Compose: repo-setup/deployment.md
      - Mail on a product's domain: repo-setup/mail.md
      - Operator pages: repo-setup/operator-pages.md
      - Going live with a payment provider: repo-setup/going-live-with-payments.md
      - Every secret in the password manager: repo-setup/secrets.md
      - Resource usage and capacity dashboards: repo-setup/resource-monitoring.md
      - Alerts that reach a person: repo-setup/alerting.md
  - Stacks:
      - Next.js app: stacks/nextjs.md
      - SQLite: stacks/sqlite.md
      - Better Auth: stacks/better-auth.md
      - mcp-login-oauth: stacks/mcp-login-oauth.md
      - Python and FastMCP: stacks/python.md
  - Working with Claude:
      - Working rules for Claude sessions: claude/session-rules.md
      - Using the Claude Code plugin: plugin.md
      - Publishing a plugin to the marketplace: claude/marketplace.md

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_javascript:
  # Pinned: Material otherwise loads the newest Mermaid 11, whose markup its styles don't all match (javascripts/mermaid.js).
  - https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
