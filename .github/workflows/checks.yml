name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: npx --yes prettier@3 --check .
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      # The shared CodeQL workflow leaves out test code and nothing else.
      - run: uv run --python 3.14 --with pyyaml scripts/check_codeql_paths.py
